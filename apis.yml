  repositories. The lendup.com domain is now operated by an unrelated entity (LendUp LLC, Dover, DE)
  that publicly disclaims any corporate relationship to LendUp Global, Inc.; its properties must NOT be
  attributed to this company profile. Retained in the network as a historical a16z portfolio record.
