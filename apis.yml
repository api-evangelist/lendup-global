description: LendUp Global, Inc. was a San Francisco consumer-lending fintech backed by a16z, operating
  through LendUp Loans, LLC (formerly Flurish, Inc.) to offer short-term and installment credit to
  subprime borrowers. The company is DEFUNCT — LendUp Loans, LLC ceased loan operations in January 2022.
